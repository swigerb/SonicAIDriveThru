# Centralized configuration for Sonic AI Drive-Thru backend.
# All magic numbers previously scattered across app.py, rtmt.py, tools.py, order_state.py
# are collected here. Changes take effect on next startup (or immediately in DEV_MODE).

model:
  temperature: 0.6
  max_response_output_tokens: 4096
  # Carhop voice. `marin` (and `cedar`) are the newest GA voices and the ones
  # OpenAI recommends for best quality. The picker offers all ten GA voices.
  # Env override: AZURE_OPENAI_REALTIME_VOICE_CHOICE.
  default_voice: "marin"
  # Guest-speech transcription model (session.audio.input.transcription.model).
  # `whisper-1` works on Azure with no extra deployment. gpt-4o-transcribe and
  # gpt-4o-mini-transcribe are ACCEPTED by session.update but every turn then
  # fails with DeploymentNotFound unless you deploy that model under the same
  # name on the resource (probed 2026-09-22).
  # Env override: AZURE_OPENAI_REALTIME_TRANSCRIPTION_MODEL.
  transcription_model: "whisper-1"
  # reasoning.effort for reasoning realtime models (gpt-realtime-2 / 2.1):
  # none | minimal | low | medium | high | xhigh. "" (empty) omits the field.
  # It is never sent to a deployment whose name marks it as non-reasoning
  # (gpt-realtime-1.5, gpt-realtime, gpt-4o-*), because those reject the whole
  # session.update -- tools included. See scripts/benchmark_reasoning.py.
  # Env override: AZURE_OPENAI_REALTIME_REASONING_EFFORT ("off" disables).
  reasoning_effort: "low"
  # parallel_tool_calls for reasoning models; null leaves the service default.
  parallel_tool_calls: null

vad:
  type: "server_vad"
  threshold: 0.5
  prefix_padding_ms: 300
  silence_duration_ms: 200

business_rules:
  tax_rate: 0.08
  max_item_quantity: 10
  max_order_items: 25
  happy_hour_start: 14
  happy_hour_end: 16
  happy_hour_discount: 0.5

cache:
  search_ttl_seconds: 60.0
  search_max_size: 128

audio:
  echo_cooldown_seconds: 1.5

search:
  k_nearest_neighbors: 15
  top_results: 3
  timeout_seconds: 10

connection:
  ws_heartbeat_seconds: 15.0
  ws_connect_timeout_total: 30
  ws_connect_timeout_connect: 10
  client_max_size_bytes: 4194304
  shutdown_timeout: 10.0
  keepalive_timeout: 75.0

compression:
  min_size_bytes: 256
  level: 6
  static_immutable_max_age: 31536000
  static_default_max_age: 3600

logging:
  verbose_result_truncate: 500

context:
  max_tokens: 128000
  warning_threshold_pct: 80
  critical_threshold_pct: 95

security:
  max_concurrent_sessions: 10
  idle_timeout_seconds: 300
  allowed_origins: []  # empty = same-origin only; add URLs for cross-origin
  require_session_token: false  # set true to require HMAC session tokens
